<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Az oldal nem található | Slisz Klaudia</title>
  <meta http-equiv="refresh" content="6; url=/slisz-klaudia/">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..640;1,9..144,400..640&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#1a1022;--paper:#f4efe8;--gold:#d8b26a;--gold-soft:#e9d3a3;--dim:#c9bfd2}
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100svh;display:grid;place-items:center;text-align:center;
      background:radial-gradient(90% 70% at 70% 20%,#3a2450 0%,transparent 55%),var(--ink);
      color:var(--paper);font-family:Manrope,system-ui,sans-serif;padding:2rem;
    }
    .code{
      font-family:Fraunces,Georgia,serif;font-weight:560;
      font-size:clamp(5rem,22vw,11rem);line-height:1;
      color:transparent;-webkit-text-stroke:1.5px rgba(216,178,106,.55);
    }
    h1{font-family:Fraunces,Georgia,serif;font-weight:520;font-size:clamp(1.3rem,3.4vw,2rem);margin:1.2rem 0 .7rem}
    h1 em{font-style:italic;color:var(--gold-soft)}
    p{color:var(--dim);max-width:38ch;margin-inline:auto;line-height:1.7}
    a{
      display:inline-block;margin-top:2rem;padding:1rem 2.2rem;border-radius:999px;
      background:var(--gold);color:var(--ink);text-decoration:none;
      font-size:.8rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
      transition:background .3s;
    }
    a:hover{background:var(--gold-soft)}
    .meta{margin-top:1.4rem;font-size:.75rem;color:#9b8fae;letter-spacing:.1em}
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Ez a kép még <em>nem készült el</em></h1>
    <p>Mintha egy félkész vászonra tévedtél volna — visszavezetünk a kiállítás főtermébe.</p>
    <a href="/slisz-klaudia/">Vissza a főoldalra</a>
    <p class="meta">Átirányítás 6 másodpercen belül…</p>
  </main>
</body>
</html>
